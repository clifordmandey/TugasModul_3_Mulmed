<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Form Registrasi</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Form Registrasi
        </h1>

        <form>

            <!-- Nama -->
            <div class="mb-3">
                <label for="nama" class="form-label">
                    Nama
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nama"
                    name="nama"
                    placeholder="Nama"
                    required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Email"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required>
            </div>

            <!-- Jenis Kelamin -->
            <div class="mb-3">
                <label for="jk" class="form-label">
                    Jenis Kelamin
                </label>

                <select
                    class="form-select"
                    id="jk"
                    name="jk">

                    <option value="Pria">Pria</option>
                    <option value="Wanita">Wanita</option>

                </select>
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="btn btn-primary">
                Submit
            </button>

        </form>

    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 py-3 border-top">

        <p class="mb-0">
            Nama: STEWARD CLIFORD MANDEY |
            NIM: 240211060057
        </p>

    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
